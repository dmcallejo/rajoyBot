[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-to-tg"
version = "0.1.0"
description = "Manage RSS feeds and publish new articles to Telegram channels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.2,<0.3",
    "aiosqlite>=0.20,<1",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "python-telegram-bot[job-queue]>=22.0,<23",
    "SQLAlchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
rss-to-tg = "rss_to_tg.main:main"

[tool.setuptools.packages.find]
include = ["rss_to_tg*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

